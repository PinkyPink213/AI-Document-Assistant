name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: test-openai-key
      OPENAI_CHAT_MODEL: gpt-4.1-mini
      OPENAI_EMBEDDINGS_MODEL: text-embedding-3-small
      POSTGRES_URL: postgresql+psycopg://postgres:password@localhost:5432/enterprise_ai
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: test-qdrant-key
      QDRANT_COLLECTION_NAME: documents
      LANGSMITH_API_KEY: test-langsmith-key
      LANGSMITH_PROJECT: enterprise-ai-document-assistant-ci
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      LANGSMITH_TRACING: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize locked dependencies
        run: uv sync --locked --dev

      - name: Lint backend
        run: uv run ruff check app tests --exclude app/playground

      - name: Run backend tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      HUSKY: "0"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
